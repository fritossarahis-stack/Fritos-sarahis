
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Pizzería y Fritos Sarahís</title>
<style>
:root{--bg:#111;--gold:#D9A441;--panel:#202020;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
header{text-align:center;padding:25px 14px;border-bottom:2px solid var(--gold)}
h1,h2{color:var(--gold)}
main{max-width:900px;margin:auto;padding:16px}
button,input,textarea{padding:11px;border-radius:7px;font-size:15px}
button{border:0;background:var(--gold);color:#111;font-weight:bold;cursor:pointer;margin:4px 2px}
input,textarea{width:100%;margin:5px 0 12px;background:#fff;color:#111;border:1px solid #aaa}
label{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card,.panel{background:var(--panel);border:1px solid #59451f;border-radius:12px;padding:14px;margin:12px 0}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.price{color:var(--gold);font-weight:bold}
.hidden{display:none}
small,.muted{color:#ccc}
</style>
</head>
<body>
<header>
<h1>🍕 Pizzería y Fritos Sarahís</h1>
<p>Pizza, fritos y mucho sabor</p>
</header>

<main>
<section>
<h2>🍽️ Nuestro menú</h2>
<p id="estado">Cargando menú...</p>
<div id="productos" class="grid"></div>
</section>

<section class="panel">
<h2>🛒 Tu pedido</h2>
<div id="carrito">Todavía no agregas productos.</div>
<p><b>Total: <span id="total">$0</span></b></p>
<label for="servicio">¿Cómo deseas recibir tu pedido?</label>
<select id="servicio" style="width:100%;padding:11px;margin:8px 0 14px">
<option value="">Selecciona una opción</option>
<option>Comer en el local</option>
<option>Recoger en el local</option>
<option>Domicilio</option>
</select>
<button id="enviar">Enviar pedido por WhatsApp</button>
<p id="aviso"></p>
</section>

<hr>
<section class="panel">
<h2>🔐 Administración</h2>
<p>Solo el administrador autorizado puede gestionar el menú.</p>
<div id="login">
<label>Correo electrónico</label>
<input id="correo" type="email" autocomplete="username" placeholder="Tu correo de administrador">
<label>Contraseña</label>
<input id="clave" type="password" autocomplete="current-password" placeholder="Tu contraseña">
<button id="entrar">Iniciar sesión</button>
<p id="loginMsg"></p>
</div>

<div id="admin" class="hidden">
<p>Sesión de administrador iniciada.</p>
<button id="salir">Cerrar sesión</button>
<h2 id="formTitulo">Agregar producto</h2>
<input id="pid" type="hidden">
<label>Nombre del producto</label>
<input id="nombre" placeholder="Ej.: Pizza hawaiana">
<label>Descripción</label>
<textarea id="descripcion" placeholder="Ingredientes o detalles"></textarea>
<label>Precio en pesos</label>
<input id="precio" type="number" min="0" step="1" placeholder="Ej.: 18000">
<label>Categoría</label>
<input id="categoria" placeholder="Ej.: Pizzas, Fritos, Bebidas">
<label>URL de la foto (opcional)</label>
<input id="foto" type="url" placeholder="https://...">
<label><input id="activo" type="checkbox" checked style="width:auto"> Producto activo y visible</label>
<button id="guardar">Guardar producto</button>
<button id="nuevo">Limpiar formulario</button>
<p id="adminMsg"></p>
<h2>Productos registrados</h2>
<div id="listaAdmin"></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ncfgdnsfjoesjwffnjtp.supabase.co";
const SUPABASE_KEY="sb_publishable_GylbgLtvi-yzxuYJm2Y9Ag_YCsVfO1x";
const WHATSAPP="584146489828";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let productos=[],carrito=[];

const $=id=>document.getElementById(id);
const dinero=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
function texto(tag,contenido){const el=document.createElement(tag);el.textContent=contenido??"";return el;}

async function cargarProductos(){
 $("estado").textContent="Cargando menú...";
 const {data,error}=await db.from("products")
  .select("id,name,description,price,category,image_url,active")
  .eq("active",true).order("name");
 if(error){$("estado").textContent="No se pudo cargar el menú. Revisa la conexión.";console.error(error);return;}
 productos=data||[];
 $("estado").textContent=productos.length?"Elige tus favoritos:":"Todavía no hay productos publicados.";
 const zona=$("productos");zona.replaceChildren();
 productos.forEach(p=>{
  const c=document.createElement("article");c.className="card";
  if(p.image_url){const img=document.createElement("img");img.src=p.image_url;img.alt=p.name;c.append(img);}
  c.append(texto("h3",p.name),texto("p",p.description||""));
  const precio=texto("p",dinero(Number(p.price)));precio.className="price";c.append(precio);
  const btn=texto("button","Agregar al pedido");btn.addEventListener("click",()=>agregar(p.id));c.append(btn);
  zona.append(c);
 });
}
function agregar(id){
 const p=productos.find(x=>x.id===id);if(!p)return;
 const en=carrito.find(x=>x.id===id);
 if(en)en.cantidad++;else carrito.push({id:p.id,nombre:p.name,precio:Number(p.price),cantidad:1});
 mostrarCarrito();
}
function mostrarCarrito(){
 const zona=$("carrito");zona.replaceChildren();
 if(!carrito.length)zona.textContent="Todavía no agregas productos.";
 carrito.forEach(item=>{
  const fila=document.createElement("p");
  fila.append(texto("span",`${item.nombre} × ${item.cantidad}: ${dinero(item.precio*item.cantidad)} `));
  const btn=texto("button","Quitar uno");
  btn.addEventListener("click",()=>{item.cantidad--;if(item.cantidad<=0)carrito=carrito.filter(x=>x.id!==item.id);mostrarCarrito();});
  fila.append(btn);zona.append(fila);
 });
 $("total").textContent=dinero(carrito.reduce((s,x)=>s+x.precio*x.cantidad,0));
}
$("enviar").addEventListener("click",()=>{
 if(!carrito.length){$("aviso").textContent="Agrega al menos un producto.";return;}
 const servicio=$("servicio").value;
 if(!servicio){$("aviso").textContent="Selecciona cómo deseas recibir el pedido.";return;}
 const total=carrito.reduce((s,x)=>s+x.precio*x.cantidad,0);
 let msg="Hola, Pizzería y Fritos Sarahís. Quiero hacer este pedido:\n\n";
 carrito.forEach(x=>msg+=`${x.nombre} × ${x.cantidad}: ${dinero(x.precio*x.cantidad)}\n`);
 msg+=`\nTotal: ${dinero(total)}\nServicio: ${servicio}\n\nPor favor, confirmen mi pedido.`;
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
});

function mostrarSesion(user){
 $("login").classList.toggle("hidden",!!user);
 $("admin").classList.toggle("hidden",!user);
 if(user)cargarAdmin();
}
async function comprobarSesion(){
 const {data}=await db.auth.getSession();
 mostrarSesion(data.session?.user||null);
}
$("entrar").addEventListener("click",async()=>{
 $("loginMsg").textContent="Comprobando acceso...";
 const {data,error}=await db.auth.signInWithPassword({email:$("correo").value.trim(),password:$("clave").value});
 if(error){$("loginMsg").textContent="No se pudo iniciar sesión. Comprueba tu correo y contraseña.";return;}
 $("clave").value="";$("loginMsg").textContent="";
 mostrarSesion(data.user);
});
$("salir").addEventListener("click",async()=>{await db.auth.signOut();mostrarSesion(null);});
db.auth.onAuthStateChange((_event,session)=>mostrarSesion(session?.user||null));

function limpiarFormulario(){
 ["pid","nombre","descripcion","precio","categoria","foto"].forEach(id=>$(id).value="");
 $("activo").checked=true;$("formTitulo").textContent="Agregar producto";
}
$("nuevo").addEventListener("click",limpiarFormulario);

async function cargarAdmin(){
 const {data,error}=await db.from("products")
  .select("id,name,description,price,category,image_url,active").order("name");
 if(error){$("adminMsg").textContent="No se pudo cargar la lista. Verifica los permisos de administrador.";return;}
 const zona=$("listaAdmin");zona.replaceChildren();
 (data||[]).forEach(p=>{
  const card=document.createElement("div");card.className="card";
  card.append(texto("strong",p.name+" — "+dinero(Number(p.price))+" "+(p.active?"(Activo)":"(Inactivo)")));
  const editar=texto("button","Editar");editar.addEventListener("click",()=>{
   $("pid").value=p.id;$("nombre").value=p.name;$("descripcion").value=p.description||"";
   $("precio").value=p.price;$("categoria").value=p.category||"";$("foto").value=p.image_url||"";
   $("activo").checked=!!p.active;$("formTitulo").textContent="Editar producto";
   window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  });
  const cambiar=texto("button",p.active?"Desactivar":"Activar");
  cambiar.addEventListener("click",()=>cambiarEstado(p.id,!p.active));
  const borrar=texto("button","Eliminar");
  borrar.addEventListener("click",()=>eliminar(p.id));
  card.append(editar,cambiar,borrar);zona.append(card);
 });
}
$("guardar").addEventListener("click",async()=>{
 $("adminMsg").textContent="";
 const nombre=$("nombre").value.trim(),precio=Number($("precio").value);
 if(!nombre||$("precio").value===""||!Number.isFinite(precio)||precio<0){
  $("adminMsg").textContent="Escribe el nombre y un precio válido.";return;
 }
 const registro={
  name:nombre,description:$("descripcion").value.trim(),
  price:precio,category:$("categoria").value.trim()||"General",
  image_url:$("foto").value.trim()||null,active:$("activo").checked
 };
 const id=$("pid").value;
 const resultado=id
  ?await db.from("products").update(registro).eq("id",id)
  :await db.from("products").insert(registro);
 if(resultado.error){
  $("adminMsg").textContent="Error: "+resultado.error.message;
  console.error(resultado.error);
  return;
}
 $("adminMsg").textContent="Producto guardado correctamente.";
 limpiarFormulario();await cargarProductos();await cargarAdmin();
});
async function cambiarEstado(id,active){
 const {error}=await db.from("products").update({active}).eq("id",id);
 if(error){$("adminMsg").textContent="No se pudo cambiar el estado.";return;}
 await cargarProductos();await cargarAdmin();
}
async function eliminar(id){
 if(!confirm("¿Seguro que quieres eliminar este producto?"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){$("adminMsg").textContent="No se pudo eliminar el producto.";return;}
 await cargarProductos();await cargarAdmin();
}
cargarProductos();
comprobarSesion();
</script>
</body>
</html>
